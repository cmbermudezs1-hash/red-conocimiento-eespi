<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Red de Conocimiento · EESPI · Bilingüe</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#F5F3EE;font-family:'Segoe UI',system-ui,sans-serif;color:#221E1A;overflow:hidden;height:100vh}

/* TOPBAR */
.topbar{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(245,243,238,.96);
  backdrop-filter:blur(12px);border-bottom:1px solid rgba(218,9,33,.25);padding:.6rem 1.2rem;
  display:flex;align-items:center;gap:.8rem;flex-wrap:wrap}
.topbar h1{font-size:.9rem;font-weight:700;color:#6B1220;white-space:nowrap;margin-right:.4rem}
.topbar h1 span{color:#DA0921}

/* SEARCH */
.search-box{flex:1;min-width:260px;max-width:420px;position:relative}
.search-box input{width:100%;padding:.45rem .9rem .45rem 2rem;border:1.5px solid rgba(107,18,32,.3);
  border-radius:20px;font-size:.85rem;background:#fff;color:#221E1A;transition:.2s}
.search-box input:focus{outline:none;border-color:#6B1220;box-shadow:0 0 0 3px rgba(107,18,32,.1)}
.search-box .ico{position:absolute;left:.7rem;top:50%;transform:translateY(-50%);color:#9A8478;font-size:.85rem}
.lang-toggle{display:flex;background:#fff;border:1.5px solid rgba(107,18,32,.25);border-radius:20px;overflow:hidden}
.lang-toggle button{border:none;background:transparent;padding:.38rem .75rem;font-size:.75rem;font-weight:600;
  cursor:pointer;color:#9A8478;transition:.15s;white-space:nowrap}
.lang-toggle button.on{background:#6B1220;color:#fff}

/* FILTER BUTTONS */
.filters{display:flex;gap:.4rem;flex-wrap:wrap}
.fbtn{border:1.5px solid rgba(107,18,32,.25);background:transparent;color:#5A524A;
  padding:.35rem .75rem;border-radius:20px;font-size:.74rem;font-weight:600;cursor:pointer;transition:.15s;white-space:nowrap}
.fbtn:hover{border-color:#6B1220;color:#6B1220}
.fbtn.on{background:#6B1220;color:#fff;border-color:#6B1220}

/* RESET */
.reset-btn{border:1.5px solid rgba(107,18,32,.25);background:transparent;color:#5A524A;
  padding:.35rem .75rem;border-radius:20px;font-size:.74rem;cursor:pointer;transition:.15s;white-space:nowrap}
.reset-btn:hover{background:#6B1220;color:#fff;border-color:#6B1220}

/* STATS BAR */
.statsbar{position:fixed;bottom:1rem;left:1.2rem;z-index:100;display:flex;gap:.6rem;flex-wrap:wrap}
.stat{background:rgba(245,243,238,.9);border:1px solid rgba(107,18,32,.15);border-radius:12px;
  padding:.3rem .7rem;font-size:.72rem;color:#5A524A;backdrop-filter:blur(6px)}
.stat b{color:#6B1220}

/* LEGEND */
.legend{position:fixed;bottom:1rem;right:1.2rem;z-index:100;background:rgba(245,243,238,.92);
  transition:right .3s ease;
  border:1px solid rgba(107,18,32,.15);border-radius:8px;padding:.7rem 1rem;backdrop-filter:blur(8px)}
.leg-item{display:flex;align-items:center;gap:.5rem;font-size:.73rem;color:#5A524A;margin-bottom:.3rem}
.leg-item:last-child{margin:0}
.leg-dot{width:10px;height:10px;border-radius:50%;flex:none}
.leg-note{font-size:.65rem;color:#9A8478;margin-top:.4rem;border-top:1px solid rgba(107,18,32,.1);padding-top:.4rem}

/* TOOLTIP */
.tooltip{position:fixed;z-index:200;background:rgba(245,243,238,.98);
  border:1.5px solid rgba(107,18,32,.4);border-radius:8px;padding:.9rem 1.1rem;
  max-width:260px;pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:0 4px 20px rgba(107,18,32,.15)}
.tooltip.show{opacity:1}
.tt-type{font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:#DA0921;font-weight:700;margin-bottom:.2rem}
.tt-name{font-size:.94rem;font-weight:700;color:#6B1220;margin-bottom:.4rem;line-height:1.2}
.tt-sub{font-size:.78rem;color:#5A524A;line-height:1.4}
.tt-count{margin-top:.4rem;font-size:.72rem;color:#9A8478}

/* SIDE PANEL */
.panel{position:fixed;right:0;top:56px;bottom:0;width:320px;z-index:90;
  background:rgba(245,243,238,.98);border-left:1px solid rgba(107,18,32,.15);
  transform:translateX(100%);transition:.3s;display:flex;flex-direction:column}
.panel.open{transform:translateX(0);box-shadow:-4px 0 20px rgba(107,18,32,.1)}
body:has(.panel.open) .legend{right:340px}
.panel-head{padding:1rem 1.2rem;border-bottom:1px solid rgba(107,18,32,.1);flex:none}
.panel-type{font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:#DA0921;font-weight:700}
.panel-name{font-size:1.05rem;font-weight:700;color:#6B1220;margin-top:.2rem;line-height:1.2}
.panel-sub{font-size:.78rem;color:#5A524A;margin-top:.2rem}
.panel-body{flex:1;overflow-y:auto;padding:1rem 1.2rem}
.panel-body::-webkit-scrollbar{width:3px}
.panel-body::-webkit-scrollbar-thumb{background:rgba(107,18,32,.3);border-radius:2px}
.p-sec{margin-bottom:1.1rem}
.p-lbl{font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:#9A8478;font-weight:700;margin-bottom:.4rem}
.p-txt{font-size:.82rem;color:#5A524A;line-height:1.5}
.p-tags{display:flex;flex-wrap:wrap;gap:.3rem;margin-top:.3rem}
.p-tag{background:#6B1220;color:#fff;border-radius:999px;padding:.2rem .55rem;
  font-size:.68rem;cursor:pointer;transition:.15s}
.p-tag:hover{background:#4A0D16}
.p-tag.en{background:#4A6FA5}
.p-tag.en:hover{background:#2E4F7A}
.p-prof{font-size:.82rem;color:#221E1A;padding:.3rem 0;border-bottom:1px solid rgba(107,18,32,.08);
  cursor:pointer;transition:.15s;display:flex;justify-content:space-between;align-items:center}
.p-prof:hover{color:#6B1220}
.p-prof-name{font-weight:600}
.p-prof-group{font-size:.68rem;color:#9A8478}
.close-panel{position:absolute;top:.7rem;right:.8rem;background:none;border:none;
  color:#9A8478;cursor:pointer;font-size:1rem;padding:.2rem}
.close-panel:hover{color:#6B1220}
.back-btn{background:#6B1220;color:#fff;border:none;border-radius:6px;padding:.45rem .9rem;
  font-size:.78rem;font-weight:600;cursor:pointer;margin-bottom:1rem;width:100%;transition:.15s}
.back-btn:hover{background:#4A0D16}

/* WORK GROUP PANEL */
.group-panel{background:#FBF3DF;border:1px solid #E7D3A0;border-radius:6px;padding:.8rem 1rem;margin-bottom:1rem}
.group-panel .gp-title{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;
  color:#8A6B1E;font-weight:700;margin-bottom:.5rem}
.group-panel .gp-count{font-size:.8rem;color:#5f4c1a;margin-bottom:.6rem}
.gp-copy{background:#96772C;color:#fff;border:none;border-radius:4px;padding:.3rem .7rem;
  font-size:.72rem;cursor:pointer;transition:.15s}
.gp-copy:hover{background:#7A5E1C}

/* GRAPH */
svg{width:100vw;height:100vh;display:block}
.node{cursor:pointer}
.node circle{stroke-width:1.5px}
.link{stroke:rgba(34,30,26,.12);stroke-width:1;fill:none}
.link.highlight{stroke:rgba(107,18,32,.6);stroke-width:2}
.node.dimmed circle{opacity:.1}
.node.dimmed text{opacity:0}
.node.highlighted circle{stroke:#6B1220;stroke-width:3}
.node.ingroup circle{stroke:#96772C;stroke-width:3}

@media(max-width:768px){.panel{width:100%}.topbar{gap:.4rem}.search-box{min-width:180px}}
</style>
</head>

<div class="topbar">

  <div class="search-box">
    <span class="ico">⌕</span>

  </div>

<svg id="graph"></svg>

<div class="legend">

  <div class="leg-item"><div class="leg-dot" style="background:#96772C"></div> Grupo de trabajo</div>

</div>

<div class="tooltip" id="tt"></div>

<div class="panel" id="panel">
  <button class="close-panel" onclick="closePanel()">✕</button>
  <div class="panel-head">
    <div class="panel-type" id="p-type"></div>
    <div class="panel-name" id="p-name"></div>
    <div class="panel-sub" id="p-sub"></div>
  </div>
  <div class="panel-body" id="p-body"></div>
</div>

const norm = s => (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();

// Color + size
const nodeColor = d => {
  if(d.type==='profesor') return '#4A90D9';
  if(d.weight >= 4) return '#6B1220';
  if(d.weight >= 2) return '#A0524A';
  return '#C4B79E';
};
const nodeR = d => {
  if(d.type==='profesor') return 8;
  if(d.weight >= 5) return 12;
  if(d.weight >= 3) return 9;
  if(d.weight >= 2) return 7;
  return 4;
};

// Simulation
const sim = d3.forceSimulation(GRAPH.nodes)
  .force('link', d3.forceLink(GRAPH.links).id(d=>d.id).distance(55).strength(.35))
  .force('charge', d3.forceManyBody().strength(-100))
  .force('center', d3.forceCenter(W/2, H/2))
  .force('collision', d3.forceCollide(d => nodeR(d)+3));

const link = g.append('g').selectAll('line')
  .data(GRAPH.links).join('line').attr('class','link');

const node = g.append('g').selectAll('g')
  .data(GRAPH.nodes).join('g').attr('class','node')
  .call(d3.drag()
    .on('start',(e,d)=>{if(!e.active)sim.alphaTarget(.3).restart();d.fx=d.x;d.fy=d.y})
    .on('drag',(e,d)=>{d.fx=e.x;d.fy=e.y})
    .on('end',(e,d)=>{if(!e.active)sim.alphaTarget(0);d.fx=null;d.fy=null}));

node.append('circle')
  .attr('r', nodeR)
  .attr('fill', nodeColor)
  .attr('stroke', d => d.type==='profesor' ? 'rgba(74,144,217,.4)' : 'rgba(107,18,32,.25)');

node.filter(d => d.type==='profesor' || (d.weight && d.weight>=3))
  .append('text')
  .text(d => d.type==='profesor' ? d.label.split(' ')[0] : (currentLang==='es' ? d.label_es||d.label : d.label))
  .attr('dy', d => -nodeR(d)-3).attr('text-anchor','middle')
  .style('font-size', d => d.type==='profesor'?'8px':'9px')
  .style('fill', d => d.type==='profesor'?'#4A3728':'#221E1A')
  .style('font-weight', d => d.weight>=3?'600':'400')
  .style('pointer-events','none');

sim.on('tick',()=>{
  link.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y)
      .attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);
  node.attr('transform',d=>`translate(${d.x},${d.y})`);
});

// Language toggle
function setLang(lang){
  currentLang = lang;
  document.getElementById('btn-es').classList.toggle('on', lang==='es');
  document.getElementById('btn-en').classList.toggle('on', lang==='en');
  // Update topic labels
  node.selectAll('text').text(function(d){
    if(d.type==='profesor') return d.label.split(' ')[0];
    if(!d.weight || d.weight<3) return '';
    return lang==='es' ? (d.label_es||d.label) : d.label;
  });
  // Update search placeholder
  document.getElementById('search').placeholder = lang==='es' 
    ? 'Buscar temática o profesor…' : 'Search topic or professor…';
}

// Filter
function setFilter(f){
  currentFilter = f;
  document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('on'));
  document.getElementById(`f-${f}`).classList.add('on');
  applyFilter();
}
function applyFilter(){
  node.style('display', d => {
    if(currentFilter==='prof') return d.type==='profesor' ? '' : 'none';
    if(currentFilter==='tema') return d.type==='tematica' ? '' : 'none';
    if(currentFilter==='shared') return d.type==='profesor' || d.weight>=2 ? '' : 'none';
    return '';
  });
  link.style('display', l => {
    const s=l.source, t=l.target;
    if(currentFilter==='prof' || currentFilter==='tema') return 'none';
    if(currentFilter==='shared'){
      const sn=typeof s==='object'?s:GRAPH.nodes[s];
      return (sn&&(sn.weight>=2||sn.type==='profesor')) ? '' : 'none';
    }
    return '';
  });
}

// Search
document.getElementById('search').addEventListener('input', e => {
  const q = norm(e.target.value.trim());
  if(!q){ doReset(true); return; }
  doSearch(q);
});

function doSearch(q){
  const matched = new Set();
  const connected = new Set();
  GRAPH.nodes.forEach(d=>{
    const searchable = d.search || [
      norm(d.label||''), norm(d.label_es||''),
      norm(d.experticia||''), norm((d.keywords||[]).join(' '))
    ].join(' ');
    if(searchable.includes(q)) matched.add(d.id);
  });
  GRAPH.links.forEach(l=>{
    const s = typeof l.source==='object' ? l.source.id : (l.s??l.source);
    const t = typeof l.target==='object' ? l.target.id : (l.t??l.target);
    if(matched.has(s)){connected.add(s);connected.add(t);}
    if(matched.has(t)){connected.add(s);connected.add(t);}
  });

  node.classed('dimmed', d=>!connected.has(d.id))
      .classed('highlighted', d=>matched.has(d.id));
  link.style('stroke', l=>{
    const [s,t]=getLinkST(l);
    return (matched.has(s)||matched.has(t)) ? 'rgba(107,18,32,.6)' : 'rgba(34,30,26,.05)';
  });

  // Count and show
  const matchedTopicIds = [...matched].filter(id=>GRAPH.nodes[id].type==='tematica');
  const directProfIds = [...matched].filter(id=>GRAPH.nodes[id].type==='profesor');
  const temaMatched = matchedTopicIds.length;

  // Aggregate ALL professors connected to ANY matched topic + directly matched professors
  const groupProfSet = new Set(directProfIds);
  GRAPH.links.forEach(l=>{
    const [s,t]=getLinkST(l);
    if(matched.has(s) && GRAPH.nodes[s].type==='tematica' && GRAPH.nodes[t].type==='profesor') groupProfSet.add(t);
    if(matched.has(t) && GRAPH.nodes[t].type==='tematica' && GRAPH.nodes[s].type==='profesor') groupProfSet.add(s);
  });

  const profMatched = groupProfSet.size;
  document.getElementById('s-result').style.display='';
  document.getElementById('s-rval').textContent = `${profMatched} prof · ${temaMatched} temáticas`;

  // Build aggregated work group panel from all matching topics
  if(groupProfSet.size > 0){
    workGroup = [...groupProfSet].map(id=>GRAPH.nodes[id]).filter(n=>n&&n.type==='profesor')
      .sort((a,b)=>a.label.localeCompare(b.label));
    markWorkGroup([...groupProfSet]);
    openGroupPanel(workGroup, matchedTopicIds.map(id=>GRAPH.nodes[id]));
  } else {
    const first = [...matched].map(id=>GRAPH.nodes[id]).find(Boolean);
    if(first) openPanel(first);
    workGroup=[];
  }
}

// Panel showing aggregated work group from a text search across multiple topics
function openGroupPanel(profs, topics){
  lastGroup = {profs: profs.slice(), topics: topics.slice()};
  document.getElementById('p-type').textContent = 'Búsqueda';
  document.getElementById('p-name').textContent = document.getElementById('search').value || 'Resultados';
  document.getElementById('p-sub').textContent = `${topics.length} temática${topics.length!==1?'s':''} relacionada${topics.length!==1?'s':''}`;

  const body = document.getElementById('p-body');
  const namesStr = profs.map(p=>p.label).join(', ');

  // Topics list (clickable chips), show shared first
  const topicsSorted = topics.slice().sort((a,b)=>(b.weight||0)-(a.weight||0));
  const topicChips = topicsSorted.slice(0,20).map(t=>
    `<span class="p-tag" onclick="clickNode(${t.id})">${currentLang==='es'?(t.label_es||t.label):t.label}</span>`
  ).join('');

  body.innerHTML = `
    ${profs.length>0?`<div class="group-panel">
      <div class="gp-title">💡 Grupo de trabajo potencial</div>
      <div class="gp-count">${profs.length} investigador${profs.length!==1?'es':''} trabajan en esta área</div>
      <button class="gp-copy" onclick="copyGroup()">Copiar lista de nombres</button>
    </div>`:''}
    <div class="p-sec"><div class="p-lbl">${profs.length} Investigador${profs.length!==1?'es':''}</div>
      ${profs.map(p=>`<div class="p-prof" onclick="clickNode(${p.id})">
        <div><div class="p-prof-name">${p.label}</div><div class="p-prof-group">${p.grupo||''}</div></div>
        <span style="color:#C4B79E;font-size:.8rem">→</span>
      </div>`).join('')}
    </div>
    ${topics.length?`<div class="p-sec"><div class="p-lbl">Temáticas encontradas (${topics.length})</div>
      <div class="p-tags">${topicChips}</div></div>`:''}`;

  document.getElementById('panel').classList.add('open');
  syncLegend();
}

function markWorkGroup(ids){
  const idSet = new Set(ids);
  node.classed('ingroup', d => idSet.has(d.id));
  node.select('circle').attr('stroke', d => 
    idSet.has(d.id) ? '#96772C' :
    d.type==='profesor' ? 'rgba(74,144,217,.4)' : 'rgba(107,18,32,.25)'
  );
}

// Tooltip
const tt = document.getElementById('tt');
let ttTimer;
node.on('mouseover',(e,d)=>{
  clearTimeout(ttTimer);
  const conns = GRAPH.links.filter(l=>{const[s,t]=getLinkST(l);return s===d.id||t===d.id;});
  const label = d.type==='tematica' ? (currentLang==='es'?(d.label_es||d.label):d.label) : d.label;
  let html = `<div class="tt-type">${d.type==='profesor'?'Profesor':'Temática'}</div>
    <div class="tt-name">${label}</div>`;
  if(d.type==='profesor'){
    html += `<div class="tt-sub">${(d.experticia||'').slice(0,100)}${(d.experticia||'').length>100?'…':''}</div>`;
  } else {
    const altLabel = currentLang==='es' ? d.label : (d.label_es||d.label);
    html += `<div class="tt-sub">${altLabel}</div>`;
  }
  html += `<div class="tt-count">${conns.length} conexion${conns.length!==1?'es':''}</div>`;
  tt.innerHTML=html; tt.classList.add('show'); moveTooltip(e);
})
.on('mousemove', moveTooltip)
.on('mouseout',()=>{ttTimer=setTimeout(()=>tt.classList.remove('show'),200)})
.on('click',(e,d)=>{ e.stopPropagation(); openPanel(d); highlight(d); });

function moveTooltip(e){
  tt.style.left=Math.min(e.clientX+14, window.innerWidth-280)+'px';
  tt.style.top=Math.max(10, e.clientY-20)+'px';
}
svg.on('click',()=>{ resetHighlight(); closePanel(); workGroup=[]; lastGroup=null; });

function getLinkST(l){
  const s = typeof l.source==='object' ? l.source.id : (l.s??l.source);
  const t = typeof l.target==='object' ? l.target.id : (l.t??l.target);
  return [s,t];
}
function highlight(d){
  const connected=new Set([d.id]);
  GRAPH.links.forEach(l=>{
    const [s,t]=getLinkST(l);
    if(s===d.id)connected.add(t); if(t===d.id)connected.add(s);
  });
  node.classed('dimmed',n=>!connected.has(n.id)).classed('highlighted',n=>n.id===d.id);
  link.style('stroke',l=>{
    const [s,t]=getLinkST(l);
    return(s===d.id||t===d.id)?'rgba(107,18,32,.7)':'rgba(34,30,26,.06)';
  });
}

function resetHighlight(){
  node.classed('dimmed',false).classed('highlighted',false).classed('ingroup',false);
  node.select('circle')
    .attr('stroke',d=>d.type==='profesor'?'rgba(74,144,217,.4)':'rgba(107,18,32,.25)');
  link.style('stroke','rgba(34,30,26,.12)').style('display','');
  document.getElementById('s-result').style.display='none';
}

function doReset(searchOnly){
  lastGroup = null;
  if(!searchOnly) svg.transition().duration(500).call(zoom.transform,d3.zoomIdentity.scale(1));
  resetHighlight();
  closePanel();
  workGroup=[];
  document.getElementById('search').value='';
  applyFilter();
  sim.alpha(.2).restart();
}

// Panel
function openPanel(d){
  const isProf = d.type==='profesor';
  const label = isProf ? d.label : (currentLang==='es'?(d.label_es||d.label):d.label);
  const altLabel = isProf ? '' : (currentLang==='es'?d.label:(d.label_es||d.label));

  document.getElementById('p-type').textContent = isProf?'Profesor':'Temática';
  document.getElementById('p-name').textContent = label;
  document.getElementById('p-sub').textContent = isProf ? (d.grupo||'') : altLabel;

  const conns = GRAPH.links.filter(l=>{const[s,t]=getLinkST(l);return s===d.id||t===d.id;});
  const body = document.getElementById('p-body');

  const backBtn = lastGroup ? `<button class="back-btn" onclick="returnToGroup()">← Volver a resultados (${lastGroup.profs.length})</button>` : '';

  if(isProf){
    const topics = conns.map(l=>{
      const[_s,_t]=getLinkST(l);const tid=_s===d.id?_t:_s;
      return GRAPH.nodes[tid];
    }).filter(Boolean).sort((a,b)=>b.weight-a.weight);

    const toEsList = topics.filter(t=>t.label_es&&t.label_es!==t.label).slice(0,8);
    const toEnList = topics.filter(t=>t.label).slice(0,8);

    body.innerHTML = `
      ${backBtn}
      ${d.experticia?`<div class="p-sec"><div class="p-lbl">Experticia</div><div class="p-txt">${d.experticia}</div></div>`:''}
      ${d.formacion?`<div class="p-sec"><div class="p-lbl">Formación</div><div class="p-txt">${d.formacion}</div></div>`:''}
      ${d.keywords&&d.keywords.length?`<div class="p-sec"><div class="p-lbl">Keywords (ES)</div><div class="p-tags">${d.keywords.map(k=>`<span class="p-tag" onclick="searchFrom('${k}')">${k}</span>`).join('')}</div></div>`:''}
      <div class="p-sec"><div class="p-lbl">Temáticas PURE (${topics.length})</div>
        <div class="p-tags">
          ${toEsList.map(t=>`<span class="p-tag" onclick="clickNode(${t.id})">${t.label_es||t.label}</span>`).join('')}
          ${toEnList.map(t=>`<span class="p-tag en" onclick="clickNode(${t.id})">${t.label}</span>`).join('')}
        </div>
      </div>
      ${d.pure_url?`<div class="p-sec"><a href="${d.pure_url}" target="_blank" rel="noopener" style="color:#6B1220;font-size:.8rem;font-weight:600">Ver perfil PURE ↗</a></div>`:''}`;
  } else {
    // Topic panel with work group
    const profs = conns.map(l=>{
      const[__s,__t]=getLinkST(l);const pid=__s===d.id?__t:__s;
      return GRAPH.nodes[pid];
    }).filter(n=>n&&n.type==='profesor').sort((a,b)=>a.label.localeCompare(b.label));

    workGroup = profs;
    markWorkGroup(profs.map(p=>p.id));

    const namesStr = profs.map(p=>p.label).join(', ');

    body.innerHTML = `
      ${backBtn}
      ${profs.length>1?`<div class="group-panel">
        <div class="gp-title">💡 Grupo de trabajo potencial</div>
        <div class="gp-count">${profs.length} investigadores comparten esta temática</div>
        <button class="gp-copy" onclick="copyGroup()">Copiar lista de nombres</button>
      </div>`:''}
      <div class="p-sec"><div class="p-lbl">${profs.length} Investigador${profs.length!==1?'es':''}</div>
        ${profs.map(p=>`<div class="p-prof" onclick="clickNode(${p.id})">
          <div><div class="p-prof-name">${p.label}</div><div class="p-prof-group">${p.grupo}</div></div>
          <span style="color:#C4B79E;font-size:.8rem">→</span>
        </div>`).join('')}
      </div>`;
  }
  document.getElementById('panel').classList.add('open');
  syncLegend();
}

function syncLegend(){
  const open = document.getElementById('panel').classList.contains('open');
  const legend = document.querySelector('.legend');
  if(legend) legend.style.right = open ? '340px' : '1.2rem';
}
function closePanel(){ document.getElementById('panel').classList.remove('open'); syncLegend(); lastGroup=null; }

function clickNode(id){
  const d=GRAPH.nodes[id];
  openPanel(d); highlight(d);
  svg.transition().duration(400).call(zoom.translateTo,d.x,d.y);
}

function returnToGroup(){
  if(!lastGroup) return;
  const profs = lastGroup.profs, topics = lastGroup.topics;
  markWorkGroup(profs.map(p=>p.id));
  openGroupPanel(profs, topics);
}

function searchFrom(kw){
  document.getElementById('search').value=kw;
  doSearch(norm(kw));
}

function copyGroup(){
  const names = workGroup.map(p=>p.label).join('\n');
  navigator.clipboard.writeText(names).then(()=>{
    const btn=document.querySelector('.gp-copy');
    btn.textContent='✓ Copiado'; btn.style.background='#4A8A5C';
    setTimeout(()=>{btn.textContent='Copiar lista de nombres';btn.style.background='';},2000);
  }).catch(()=>{
    prompt('Copia los nombres:', names);
  });
}

window.addEventListener('resize',()=>{
  svg.attr('width',window.innerWidth).attr('height',window.innerHeight);
  sim.force('center',d3.forceCenter(window.innerWidth/2,window.innerHeight/2)).alpha(.1).restart();
});
</script>
</body>
</html>
