const W = window.innerWidth, H = window.innerHeight;
const svg = d3.select('#graph').attr('width', W).attr('height', H);
const g   = svg.append('g');

// Zoom
const zoom = d3.zoom().scaleExtent([.1, 8])
  .on('zoom', e => g.attr('transform', e.transform));
svg.call(zoom);

// Color scales
const colorNode = d => {
  if(d.type === 'profesor') return '#4A90D9';
  return d.weight > 1 ? '#DA0921' : '#5A524A';
};
const radiusNode = d => {
  if(d.type === 'profesor') return 7;
  if(d.weight >= 4) return 10;
  if(d.weight >= 2) return 7;
  return 4;
};

// Simulation
const sim = d3.forceSimulation(GRAPH.nodes)
  .force('link', d3.forceLink(GRAPH.links).id(d=>d.id).distance(60).strength(.4))
  .force('charge', d3.forceManyBody().strength(-120))
  .force('center', d3.forceCenter(W/2, H/2))
  .force('collision', d3.forceCollide(d => radiusNode(d) + 4));

// Links
const link = g.append('g').selectAll('line')
  .data(GRAPH.links).join('line').attr('class','link');

// Nodes
const node = g.append('g').selectAll('g')
  .data(GRAPH.nodes).join('g')
  .attr('class','node')
  .call(d3.drag()
    .on('start', (e,d)=>{ if(!e.active) sim.alphaTarget(.3).restart(); d.fx=d.x; d.fy=d.y; })
    .on('drag',  (e,d)=>{ d.fx=e.x; d.fy=e.y; })
    .on('end',   (e,d)=>{ if(!e.active) sim.alphaTarget(0); d.fx=null; d.fy=null; }));

node.append('circle')
  .attr('r', radiusNode)
  .attr('fill', colorNode)
  .attr('stroke', d => d.type==='profesor' ? 'rgba(74,144,217,.5)' : 'rgba(218,9,33,.3)');

// Labels for high-weight nodes
node.filter(d => d.type==='profesor' || (d.weight && d.weight >= 3))
  .append('text')
  .text(d => d.type==='profesor' ? d.label.split(' ')[0] : d.label)
  .attr('dy', d => -radiusNode(d) - 3)
  .attr('text-anchor','middle')
  .style('font-size', d => d.type==='profesor' ? '9px' : '10px')
  .style('fill', d => d.type==='profesor' ? '#4A3728' : '#221E1A')
  .style('font-weight', d => d.weight>=3 ? '600' : '400');

sim.on('tick', () => {
  link.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y)
      .attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);
  node.attr('transform',d=>`translate(${d.x},${d.y})`);
});

// Tooltip
const tooltip = document.getElementById('tooltip');
let hoverTimeout;

node.on('mouseover', (e, d) => {
  clearTimeout(hoverTimeout);
  const conns = GRAPH.links.filter(l =>
    (l.source.id||l.source)===d.id || (l.target.id||l.target)===d.id);
  let html = `<div class="tt-type">${d.type==='profesor'?'Profesor':'Temática'}</div>
    <div class="tt-name">${d.label}</div>`;
  if(d.type==='profesor'){
    const exp = d.experticia ? d.experticia.slice(0,120)+'…' : '';
    html += `<div class="tt-body">${exp}</div>`;
    if(d.keywords) html += `<div class="tt-kw">${d.keywords.split(',').slice(0,4).map(k=>`<span>${k.trim()}</span>`).join('')}</div>`;
    html += `<div class="tt-body" style="margin-top:.4rem;color:rgba(34,30,26,.5)">${conns.length} conexiones temáticas</div>`;
  } else {
    html += `<div class="tt-body">${conns.length} profesor${conns.length>1?'es':''} trabaja${conns.length>1?'n':''} esta temática</div>`;
  }
  tooltip.innerHTML = html;
  tooltip.classList.add('show');
  moveTooltip(e);
})
.on('mousemove', moveTooltip)
.on('mouseout', () => {
  hoverTimeout = setTimeout(() => tooltip.classList.remove('show'), 200);
})
.on('click', (e, d) => { e.stopPropagation(); openPanel(d); highlightNode(d); });

function moveTooltip(e){
  const x = e.clientX + 14, y = e.clientY - 20;
  tooltip.style.left = Math.min(x, window.innerWidth - 300) + 'px';
  tooltip.style.top  = Math.max(10, y) + 'px';
}

svg.on('click', () => { resetHighlight(); closePanel(); });

// Highlight on click
function highlightNode(d){
  const connected = new Set([d.id]);
  GRAPH.links.forEach(l => {
    const s = l.source.id??l.source, t = l.target.id??l.target;
    if(s===d.id) connected.add(t);
    if(t===d.id) connected.add(s);
  });
  node.classed('dimmed', n => !connected.has(n.id))
      .classed('highlighted', n => n.id===d.id);
  link.classed('highlight', l => {
    const s=l.source.id??l.source, t=l.target.id??l.target;
    return s===d.id||t===d.id;
  }).style('stroke', l => {
    const s=l.source.id??l.source, t=l.target.id??l.target;
    return (s===d.id||t===d.id) ? 'rgba(218,9,33,.8)' : 'rgba(255,255,255,.06)';
  });
}

function resetHighlight(){
  node.classed('dimmed',false).classed('highlighted',false).style('opacity',1);
  link.classed('highlight',false)
      .style('stroke','rgba(34,30,26,.15)')
      .style('stroke-width','1')
      .style('display','');
}

        ${profs.map(p=>`<div class="p-prof" onclick="clickNode(${p.id})">${p.label}</div>`).join('')}</div>`;
  }
  panel.classList.add('open');
}

function closePanel(){ document.getElementById('panel').classList.remove('open'); }

function clickNode(id){
  const d = GRAPH.nodes[id];
  openPanel(d); highlightNode(d);
  // zoom to node
  const t = d3.zoomTransform(svg.node());
  svg.transition().duration(500).call(zoom.translateTo, d.x, d.y);
}

function searchTopic(kw){
  document.getElementById('search').value = kw;
  doSearch(kw);
}

// Filter modes
let currentFilter = 'all';
function filterNodes(mode){
  currentFilter = mode;
  document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
  document.getElementById(`btn-${mode==='all'?'all':mode==='profesor'?'prof':mode==='tematica'?'tema':'shared'}`).classList.add('active');

  const sbar = document.getElementById('s-filter');
  const sval = document.getElementById('s-filter-val');
  if(mode !== 'all'){ sbar.style.display=''; sval.textContent=mode==='shared'?'Temáticas compartidas':mode; }
  else sbar.style.display='none';

  node.each(function(d){
    let visible = true;
    if(mode==='profesor') visible = d.type==='profesor';
    else if(mode==='tematica') visible = d.type==='tematica';
    else if(mode==='shared') visible = d.type==='profesor' || (d.type==='tematica' && d.weight >= 2);
    d3.select(this).style('display', visible ? '' : 'none');
  });
  link.style('display', l => {
    const s = l.source, t = l.target;
    if(mode==='profesor') return 'none';
    if(mode==='tematica') return 'none';
    if(mode==='shared') return (s.weight>=2||s.type==='profesor') && (t.weight>=2||t.type==='profesor') ? '' : 'none';
    return '';
  });
  sim.alpha(.3).restart();
}

// Search
document.getElementById('search').addEventListener('input', e => doSearch(e.target.value));
function doSearch(val){
  const q = val.trim().toLowerCase();
  if(!q){ resetHighlight(); return; }
  const matched = new Set();
  const connected = new Set();
  GRAPH.nodes.forEach(d => {
    if(d.label.toLowerCase().includes(q) || (d.experticia||'').toLowerCase().includes(q) || (d.keywords||'').toLowerCase().includes(q))
      matched.add(d.id);
  });
  GRAPH.links.forEach(l => {
    const s=l.source.id??l.source, t=l.target.id??l.target;
    if(matched.has(s)){connected.add(s);connected.add(t);}
    if(matched.has(t)){connected.add(s);connected.add(t);}
  });
  node.classed('dimmed', d => !connected.has(d.id))
      .classed('highlighted', d => matched.has(d.id));
  link.style('stroke', l => {
    const s=l.source.id??l.source, t=l.target.id??l.target;
    return (matched.has(s)||matched.has(t)) ? 'rgba(218,9,33,.7)' : 'rgba(255,255,255,.06)';
  });
  // Open panel for first match
  const first = GRAPH.nodes.find(d => matched.has(d.id));
  if(first) openPanel(first);
}

function resetZoom(){
  // Reset zoom to center
  svg.transition().duration(500).call(zoom.transform, d3.zoomIdentity.scale(1));
  // Restore all nodes and links
  resetHighlight();
  // Explicitly restore link visibility and style
  link.style('display','').style('stroke','rgba(34,30,26,.15)').style('stroke-width','1');
  // Restore all node visibility
  node.style('display','').classed('dimmed',false).classed('highlighted',false);
  // Close panel and clear search
  closePanel();
  document.getElementById('search').value = '';
  // Re-center simulation
  sim.force('center', d3.forceCenter(window.innerWidth/2, window.innerHeight/2)).alpha(.3).restart();
}

window.addEventListener('resize', () => {
  svg.attr('width', window.innerWidth).attr('height', window.innerHeight);
  sim.force('center', d3.forceCenter(window.innerWidth/2, window.innerHeight/2)).alpha(.2).restart();
});
</script>
</body>
</html>
